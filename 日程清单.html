<body>
  <main class="app">
    <section class="calendar-pane" aria-label="日历任务">
      <div class="topline"><div class="brand"><span class="brand-mark">✓</span>日程清单</div><div class="date-note" id="fullDate"></div></div>
      <section class="goals-panel" aria-labelledby="goalsTitle"><div class="goals-head"><h2 id="goalsTitle">长期目标</h2><button class="text-add" id="addGoalButton" type="button">＋ 添加</button></div><div class="goals-list" id="goalsList"></div><p class="goal-empty" id="goalEmpty">还没有长期目标</p></section>
      <div class="calendar-head"><div><p class="eyebrow">日历</p><h2 id="monthTitle"></h2></div><div class="nav"><button class="icon-btn" id="prevMonth" aria-label="上一个月">‹</button><button class="icon-btn" id="nextMonth" aria-label="下一个月">›</button></div></div>
      <div class="weekday-row" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar-grid" id="calendar" aria-label="月历"></div>
